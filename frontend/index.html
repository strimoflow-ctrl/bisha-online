<!doctype html>
<html lang="hi" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/images/hrry-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>दिशा ऑनलाइन क्लासेस (HRRY DISHA) - ब्लैक एडिशन</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              app: {
                bg: '#000000',
                surface: '#0d0d0f',
                card: '#141417',
                border: '#242429',
                borderHover: '#383842',
                sub: '#8e8e99',
                accent: '#ef4444',
                blue: '#3b82f6',
                emerald: '#10b981'
              }
            },
            fontFamily: {
              sans: ['"Plus Jakarta Sans"', '"Noto Sans Devanagari"', 'sans-serif'],
            }
          }
        }
      }
    </script>
    <style>
      body {
        font-family: 'Plus Jakarta Sans', 'Noto Sans Devanagari', sans-serif;
        background-color: #000000;
        color: #ffffff;
        -webkit-tap-highlight-color: transparent;
      }
      /* Custom fine scrollbar */
      ::-webkit-scrollbar {
        width: 4px;
        height: 4px;
      }
      ::-webkit-scrollbar-track {
        background: #000000;
      }
      ::-webkit-scrollbar-thumb {
        background: #242429;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #383842;
      }
    </style>
  </head>
  <body class="bg-black text-white min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
